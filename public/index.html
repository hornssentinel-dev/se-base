<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SE Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Design tokens. The slate scale is DELIBERATELY overridden rather than
       swapped out class-by-class: se-tracker.jsx addresses surfaces as
       bg-slate-900 / border-slate-800 in a few hundred places, so redefining
       the scale re-skins the whole app at once and keeps every existing class
       meaningful. Values are the blue-tinted greys from the sentinel dashboard
       (platforms/multi-tenant/dashboard), whose palette notes describe them as
       colourblind-safe — worth keeping for an app that encodes PoC health as
       colour. Teal stays the brand accent; that's SE Tracker's own identity. -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            slate: {
              50:  '#F8FAFC',
              100: '#F1F3F7',
              200: '#E5E7EB',
              300: '#C3CAD6',
              400: '#9CA3AF',
              500: '#6B7280',
              600: '#4A5A6E',
              700: '#354252',
              800: '#26304A',
              850: '#1B2236',
              900: '#151B2E',
              950: '#0A0E17',
            },
            brand: {
              DEFAULT: '#2dd4bf',
              soft: 'rgba(45,212,191,0.12)',
            },
          },
          boxShadow: {
            card: '0 1px 2px rgba(0,0,0,0.35)',
            pop: '0 16px 48px -12px rgba(0,0,0,0.65)',
          },
        },
      },
    };
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body, #root {
      width: 100%;
      height: 100%;
    }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0A0E17;
      color: #E5E7EB;
      -webkit-font-smoothing: antialiased;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .animate-spin {
      animation: spin 1s linear infinite;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: none; }
    }
    .fade-up { animation: fadeUp 180ms ease-out both; }

    /* Scrollbars that belong to the dark surface rather than the OS */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #0A0E17; }
    ::-webkit-scrollbar-thumb { background: #26304A; border-radius: 6px; border: 2px solid #0A0E17; }
    ::-webkit-scrollbar-thumb:hover { background: #354252; }

    /* Native controls inherit the dark surface (date pickers, selects) */
    :root { color-scheme: dark; }

    /* One card definition, so panels are consistent everywhere */
    .card {
      background: #151B2E;
      border: 1px solid #26304A;
      border-radius: 0.75rem;
    }

    /* Sidebar item: translucent accent fill + accent text when active,
       matching how the reference dashboard marks the current page. */
    .nav-link {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      width: 100%;
      padding: 0.5rem 0.625rem;
      border-radius: 0.5rem;
      color: #9CA3AF;
      font-size: 0.8125rem;
      font-weight: 500;
      transition: background 140ms ease, color 140ms ease;
    }
    .nav-link:hover { background: #1B2236; color: #E5E7EB; }
    .nav-link.active { background: rgba(45, 212, 191, 0.12); color: #2dd4bf; }
    .nav-section {
      margin: 1.25rem 0 0.375rem;
      padding: 0 0.625rem;
      font-size: 0.625rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #6B7280;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- se-tracker.jsx is the single source of truth for the UI. It's plain JSX
       with ES module imports; Babel standalone transforms the JSX in-browser
       and the import map below resolves the bare "react" / "lucide-react"
       specifiers to CDN builds, so there's no build step. -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18",
      "react/jsx-runtime": "https://esm.sh/react@18/jsx-runtime",
      "react-dom/client": "https://esm.sh/react-dom@18/client?external=react",
      "lucide-react": "https://esm.sh/lucide-react@latest?external=react"
    }
  }
  </script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" data-type="module" data-presets="react" src="/se-tracker.jsx"></script>
</body>
</html>
