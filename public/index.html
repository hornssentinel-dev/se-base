<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SE Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body, #root {
      width: 100%;
      height: 100%;
    }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .animate-spin {
      animation: spin 1s linear infinite;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>

  <script>
    const { useState, useEffect, useMemo } = React;
    const { createRoot } = ReactDOM;

    // ---- constants ---------------------------------------------------------------
    const STORE_KEY = "se-tracker:opps:v1";

    const SE_STAGES = [
      "Discovery",
      "Technical validation",
      "PoC",
      "Technical win",
      "Handoff / closed",
    ];

    const PRODUCTS = ["SWG", "CASB", "PA", "ADVDLP", "RBI", "DSPM", "ICAP", "FwaaS"];
    const NOTE_TYPES = ["Discovery", "Call", "Technical", "Internal", "Risk"];

    const POC_STATUS = {
      pending: { label: "Pending", color: "#94a3b8" },
      pass: { label: "Pass", color: "#34d399" },
      fail: { label: "Fail", color: "#fb7185" },
      blocked: { label: "Blocked", color: "#fbbf24" },
    };

    const HEALTH = {
      none: { label: "No PoC", color: "#64748b", dot: "#475569" },
      green: { label: "Healthy", color: "#34d399", dot: "#34d399" },
      amber: { label: "At risk", color: "#fbbf24", dot: "#fbbf24" },
      red: { label: "Critical", color: "#fb7185", dot: "#fb7185" },
    };

    const uid = () => Math.random().toString(36).slice(2, 10);
    const today = () => new Date().toISOString().slice(0, 10);

    const formatCurrency = (num) => {
      if (!num) return "";
      return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    };

    const parseCurrency = (str) => {
      return parseInt(str.replace(/,/g, "")) || 0;
    };

    function derivePocHealth(opp) {
      const poc = opp.poc;
      if (!poc || !poc.active || !poc.criteria?.length) return "none";
      const statuses = poc.criteria.map((c) => c.status);
      if (statuses.includes("fail") || statuses.includes("blocked")) return "red";
      const allPass = statuses.every((s) => s === "pass");
      if (allPass) return "green";
      const overdue = poc.targetDate && poc.targetDate < today();
      if (overdue) return "amber";
      return "green";
    }

    function addDays(n) {
      const d = new Date();
      d.setDate(d.getDate() + n);
      return d.toISOString().slice(0, 10);
    }

    const sampleOpp = () => ({
      id: uid(),
      account: "Nexum Financial",
      segment: "Enterprise · FinServ",
      acv: 185000,
      nextMeetDate: addDays(14),
      seStage: "PoC",
      products: ["SWG", "CASB", "DLP"],
      champion: "Dana Okafor — Dir. Infrastructure",
      competitor: "Zscaler",
      nextAction: "Validate DLP inline scanning against their EDM fingerprints",
      createdAt: today(),
      notes: [
        {
          id: uid(),
          date: today(),
          type: "Discovery",
          body: "Driver is M365 + Salesforce data exfil risk after a near-miss. Champion wants inline DLP, not just CASB API. Security team is 4 people, lean.",
        },
      ],
      demos: [
        {
          id: uid(),
          date: addDays(-7),
          products: ["SWG", "CASB"],
          audience: "Security team (4) + CISO",
          outcome: "positive",
          notes: "RBI isolation landed well. CISO asked about FedRAMP roadmap.",
        },
      ],
      poc: {
        active: true,
        startDate: addDays(-5),
        targetDate: addDays(16),
        criteria: [
          { id: uid(), label: "Inline SWG decrypt + DLP on M365 uploads", status: "pass", owner: "SE", note: "Verified with test ruleset." },
          { id: uid(), label: "EDM fingerprint match on customer PII set", status: "pending", owner: "SE", note: "" },
          { id: uid(), label: "CASB shadow-AI detection (ChatGPT, Claude, Gemini)", status: "pending", owner: "Joint", note: "" },
          { id: uid(), label: "ZTNA access to internal HR app, no VPN", status: "blocked", owner: "Customer", note: "Waiting on their AD group cleanup." },
        ],
      },
    });

    // ---- storage layer -----------------------------------------------------------
    async function loadOpps() {
      try {
        const res = await fetch(`/api/storage/${STORE_KEY}`);
        const data = await res.json();
        if (data.value) return JSON.parse(data.value);
      } catch (e) {
        console.error("Load failed", e);
      }
      return [];
    }

    async function persist(opps) {
      try {
        await fetch(`/api/storage/${STORE_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ value: JSON.stringify(opps) })
        });
      } catch (e) {
        console.error("Save failed", e);
      }
    }

    // ---- UI Components ---------------------------------------------------------------
    function StatTile({ icon, label, value, sub, accent }) {
      return (
        React.createElement('div', { className: "rounded-lg border border-slate-800 bg-slate-900 p-4" },
          React.createElement('div', { className: "flex items-center gap-2 text-slate-400 text-xs uppercase tracking-wider" },
            React.createElement('span', { style: { color: accent } }, icon),
            label
          ),
          React.createElement('div', { className: "mt-2 text-2xl font-semibold text-slate-100 tabular-nums" }, value),
          sub && React.createElement('div', { className: "mt-0.5 text-xs text-slate-500" }, sub)
        )
      );
    }

    function HealthDot({ health }) {
      const h = HEALTH[health] || HEALTH.none;
      return React.createElement('span',
        { className: "inline-flex items-center gap-1.5 text-xs", style: { color: h.color } },
        React.createElement('span', { className: "inline-block w-2 h-2 rounded-full", style: { background: h.dot } }),
        h.label
      );
    }

    function Pill({ children }) {
      return React.createElement('span',
        { className: "inline-block rounded border border-slate-700 bg-slate-800 px-1.5 py-0.5 text-[11px] font-mono text-slate-300" },
        children
      );
    }

    function Field({ label, children }) {
      return React.createElement('label', { className: "block" },
        React.createElement('span', { className: "block text-[11px] uppercase tracking-wider text-slate-500 mb-1" }, label),
        children
      );
    }

    const inputCls = "w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 placeholder-slate-600 focus:border-teal-500 focus:outline-none";

    function DateInput({ value, onChange }) {
      const inputRef = React.useRef(null);

      useEffect(() => {
        if (inputRef.current && window.flatpickr) {
          flatpickr(inputRef.current, {
            mode: "single",
            dateFormat: "Y-m-d",
            defaultDate: value || null,
            onChange: (dates) => {
              if (dates[0]) {
                const dateStr = dates[0].toISOString().split('T')[0];
                onChange(dateStr);
              }
            }
          });
        }
      }, []);

      return React.createElement('input', {
        ref: inputRef,
        type: "text",
        className: inputCls,
        value: value || "",
        placeholder: "Click to pick a date",
        readOnly: true
      });
    }

    function Empty({ msg }) {
      return React.createElement('div', { className: "text-center text-sm text-slate-600 py-6" }, msg);
    }

    // ---- Tab Components ---------------------------------------------------------------
    function OverviewTab({ opp, update }) {
      const set = (key, val) => update(opp.id, (o) => ({ ...o, [key]: val }));
      const toggleProduct = (p) =>
        update(opp.id, (o) => {
          const has = o.products?.includes(p);
          return { ...o, products: has ? o.products.filter((x) => x !== p) : [...(o.products || []), p] };
        });

      return React.createElement('div', { className: "grid md:grid-cols-2 gap-5" },
        React.createElement('div', { className: "space-y-4" },
          React.createElement(Field, { label: "SE stage" },
            React.createElement('select', { className: inputCls, value: opp.seStage, onChange: (e) => set("seStage", e.target.value) },
              SE_STAGES.map((s) => React.createElement('option', { key: s, value: s }, s))
            )
          ),
          React.createElement(Field, { label: "Products under evaluation" },
            React.createElement('div', { className: "flex flex-wrap gap-1.5" },
              PRODUCTS.map((p) => {
                const on = opp.products?.includes(p);
                return React.createElement('button', {
                  key: p,
                  onClick: () => toggleProduct(p),
                  className: `rounded px-2 py-1 text-xs font-mono border ${
                    on ? "border-teal-500 bg-teal-500/10 text-teal-300" : "border-slate-700 bg-slate-900 text-slate-500 hover:border-slate-600"
                  }`
                }, p);
              })
            )
          ),
          React.createElement(Field, { label: "Next SE action" },
            React.createElement('textarea', {
              className: inputCls,
              rows: 2,
              value: opp.nextAction || "",
              onChange: (e) => set("nextAction", e.target.value),
              placeholder: "The one thing only the SE can move forward…"
            })
          )
        ),
        React.createElement('div', { className: "space-y-4" },
          React.createElement('div', { className: "grid grid-cols-2 gap-3" },
            React.createElement(Field, { label: "ACV ($)" },
              React.createElement('input', {
                type: "text",
                className: inputCls,
                value: formatCurrency(opp.acv),
                onChange: (e) => set("acv", parseCurrency(e.target.value)),
                placeholder: "0"
              })
            ),
            React.createElement(Field, { label: "Next meet date" },
              React.createElement(DateInput, { value: opp.nextMeetDate, onChange: (date) => set("nextMeetDate", date) })
            )
          ),
          React.createElement(Field, { label: "Champion" },
            React.createElement('div', { className: "flex items-center gap-2" },
              React.createElement('span', { style: { color: "#64748b" } }, "👤"),
              React.createElement('input', { className: inputCls, value: opp.champion || "", onChange: (e) => set("champion", e.target.value), placeholder: "Name — role" })
            )
          ),
          React.createElement(Field, { label: "Primary competitor" },
            React.createElement('div', { className: "flex items-center gap-2" },
              React.createElement('span', { style: { color: "#64748b" } }, "⚔️"),
              React.createElement('input', { className: inputCls, value: opp.competitor || "", onChange: (e) => set("competitor", e.target.value), placeholder: "e.g. Zscaler, Netskope" })
            )
          ),
          React.createElement(Field, { label: "Segment" },
            React.createElement('div', { className: "flex items-center gap-2" },
              React.createElement('span', { style: { color: "#64748b" } }, "🏢"),
              React.createElement('input', { className: inputCls, value: opp.segment || "", onChange: (e) => set("segment", e.target.value) })
            )
          )
        )
      );
    }

    function NotesTab({ opp, update }) {
      const [type, setType] = useState("Discovery");
      const [body, setBody] = useState("");

      const add = () => {
        if (!body.trim()) return;
        const note = { id: uid(), date: today(), type, body: body.trim() };
        update(opp.id, (o) => ({ ...o, notes: [note, ...(o.notes || [])] }));
        setBody("");
      };
      const del = (id) => update(opp.id, (o) => ({ ...o, notes: o.notes.filter((n) => n.id !== id) }));

      return React.createElement('div', null,
        React.createElement('div', { className: "rounded-lg border border-slate-800 bg-slate-900 p-3" },
          React.createElement('div', { className: "flex items-center gap-2 mb-2" },
            NOTE_TYPES.map((t) =>
              React.createElement('button', {
                key: t,
                onClick: () => setType(t),
                className: `rounded px-2 py-1 text-[11px] border ${
                  type === t ? "border-teal-500 bg-teal-500/10 text-teal-300" : "border-slate-700 bg-slate-950 text-slate-400"
                }`
              }, t)
            )
          ),
          React.createElement('textarea', {
            className: inputCls,
            rows: 3,
            value: body,
            onChange: (e) => setBody(e.target.value),
            placeholder: "What did you learn? Decision drivers, technical requirements, objections…"
          }),
          React.createElement('div', { className: "flex justify-end mt-2" },
            React.createElement('button', {
              onClick: add,
              className: "inline-flex items-center gap-1.5 rounded-md px-3 py-1.5 text-xs font-medium text-slate-950",
              style: { background: "#2dd4bf" }
            }, "➕ Add note")
          )
        ),
        React.createElement('div', { className: "mt-4 space-y-3" },
          (opp.notes || []).length === 0 && React.createElement(Empty, { msg: "No notes yet. Capture discovery while it's fresh." }),
          (opp.notes || []).map((n) =>
            React.createElement('div', { key: n.id, className: "rounded-lg border border-slate-800 bg-slate-900 p-3" },
              React.createElement('div', { className: "flex items-center justify-between" },
                React.createElement('div', { className: "flex items-center gap-2" },
                  React.createElement(Pill, null, n.type),
                  React.createElement('span', { className: "font-mono text-[11px] text-slate-500" }, n.date)
                ),
                React.createElement('button', { onClick: () => del(n.id), className: "text-slate-600 hover:text-rose-400" }, "🗑")
              ),
              React.createElement('p', { className: "mt-2 text-sm text-slate-300 whitespace-pre-wrap" }, n.body)
            )
          )
        )
      );
    }

    function DemosTab({ opp, update }) {
      const [open, setOpen] = useState(false);
      const [draft, setDraft] = useState({ date: today(), products: [], audience: "", outcome: "positive", notes: "" });

      const toggleP = (p) =>
        setDraft((d) => ({ ...d, products: d.products.includes(p) ? d.products.filter((x) => x !== p) : [...d.products, p] }));

      const add = () => {
        const demo = { ...draft, id: uid() };
        update(opp.id, (o) => ({ ...o, demos: [demo, ...(o.demos || [])] }));
        setDraft({ date: today(), products: [], audience: "", outcome: "positive", notes: "" });
        setOpen(false);
      };
      const del = (id) => update(opp.id, (o) => ({ ...o, demos: o.demos.filter((d) => d.id !== id) }));

      const outcomeColor = { positive: "#34d399", neutral: "#94a3b8", negative: "#fb7185" };

      return React.createElement('div', null,
        !open && React.createElement('button', {
          onClick: () => setOpen(true),
          className: "inline-flex items-center gap-1.5 rounded-md border border-slate-700 bg-slate-900 px-3 py-2 text-xs text-slate-300 hover:border-slate-600"
        }, "📹 Log a demo"),
        open && React.createElement('div', { className: "rounded-lg border border-slate-800 bg-slate-900 p-3 space-y-3" },
          React.createElement('div', { className: "grid grid-cols-2 gap-3" },
            React.createElement(Field, { label: "Date" },
              React.createElement(DateInput, { value: draft.date, onChange: (date) => setDraft({ ...draft, date }) })
            ),
            React.createElement(Field, { label: "Outcome" },
              React.createElement('select', { className: inputCls, value: draft.outcome, onChange: (e) => setDraft({ ...draft, outcome: e.target.value }) },
                React.createElement('option', { value: "positive" }, "Positive"),
                React.createElement('option', { value: "neutral" }, "Neutral"),
                React.createElement('option', { value: "negative" }, "Needs work")
              )
            )
          ),
          React.createElement(Field, { label: "Products shown" },
            React.createElement('div', { className: "flex flex-wrap gap-1.5" },
              PRODUCTS.map((p) =>
                React.createElement('button', {
                  key: p,
                  onClick: () => toggleP(p),
                  className: `rounded px-2 py-1 text-xs font-mono border ${
                    draft.products.includes(p) ? "border-teal-500 bg-teal-500/10 text-teal-300" : "border-slate-700 bg-slate-950 text-slate-500"
                  }`
                }, p)
              )
            )
          ),
          React.createElement(Field, { label: "Audience" },
            React.createElement('input', { className: inputCls, value: draft.audience, onChange: (e) => setDraft({ ...draft, audience: e.target.value }), placeholder: "Who was in the room" })
          ),
          React.createElement(Field, { label: "Notes" },
            React.createElement('textarea', { className: inputCls, rows: 2, value: draft.notes, onChange: (e) => setDraft({ ...draft, notes: e.target.value }), placeholder: "What resonated, what fell flat" })
          ),
          React.createElement('div', { className: "flex justify-end gap-2" },
            React.createElement('button', { onClick: () => setOpen(false), className: "rounded-md border border-slate-700 px-3 py-1.5 text-xs text-slate-400" }, "Cancel"),
            React.createElement('button', { onClick: add, className: "rounded-md px-3 py-1.5 text-xs font-medium text-slate-950", style: { background: "#2dd4bf" } }, "Save demo")
          )
        ),
        React.createElement('div', { className: "mt-4 space-y-3" },
          (opp.demos || []).length === 0 && !open && React.createElement(Empty, { msg: "No demos logged yet." }),
          (opp.demos || []).map((d) =>
            React.createElement('div', { key: d.id, className: "rounded-lg border border-slate-800 bg-slate-900 p-3" },
              React.createElement('div', { className: "flex items-center justify-between" },
                React.createElement('div', { className: "flex items-center gap-2 flex-wrap" },
                  React.createElement('span', { className: "font-mono text-[11px] text-slate-500" }, d.date),
                  (d.products || []).map((p) => React.createElement(Pill, { key: p }, p)),
                  React.createElement('span', { className: "text-[11px]", style: { color: outcomeColor[d.outcome] } }, `● ${d.outcome}`)
                ),
                React.createElement('button', { onClick: () => del(d.id), className: "text-slate-600 hover:text-rose-400" }, "🗑")
              ),
              d.audience && React.createElement('div', { className: "mt-1.5 text-xs text-slate-400" }, `👥 ${d.audience}`),
              d.notes && React.createElement('p', { className: "mt-1.5 text-sm text-slate-300 whitespace-pre-wrap" }, d.notes)
            )
          )
        )
      );
    }

    function PocTab({ opp, update }) {
      const poc = opp.poc || { active: false, criteria: [] };
      const [label, setLabel] = useState("");
      const [owner, setOwner] = useState("SE");

      const setPoc = (fn) => update(opp.id, (o) => ({ ...o, poc: fn({ ...(o.poc || { active: false, criteria: [] }) }) }));

      const startPoc = () =>
        setPoc((p) => ({ ...p, active: true, startDate: p.startDate || today(), targetDate: p.targetDate || addDays(21), criteria: p.criteria || [] }));
      const stopPoc = () => setPoc((p) => ({ ...p, active: false }));

      const addCriterion = () => {
        if (!label.trim()) return;
        setPoc((p) => ({ ...p, criteria: [...(p.criteria || []), { id: uid(), label: label.trim(), status: "pending", owner, note: "" }] }));
        setLabel("");
      };
      const setStatus = (cid, status) =>
        setPoc((p) => ({ ...p, criteria: p.criteria.map((c) => (c.id === cid ? { ...c, status } : c)) }));
      const setNote = (cid, note) =>
        setPoc((p) => ({ ...p, criteria: p.criteria.map((c) => (c.id === cid ? { ...c, note } : c)) }));
      const delCriterion = (cid) =>
        setPoc((p) => ({ ...p, criteria: p.criteria.filter((c) => c.id !== cid) }));

      if (!poc.active) {
        return React.createElement('div', { className: "rounded-xl border border-dashed border-slate-800 bg-slate-900/50 p-8 text-center" },
          React.createElement('span', { style: { fontSize: "26px" } }, "🧪"),
          React.createElement('h3', { className: "mt-2 text-slate-200 font-medium" }, "No active PoC"),
          React.createElement('p', { className: "mt-1 text-sm text-slate-500 max-w-sm mx-auto" }, "Spin up a PoC to track success criteria."),
          React.createElement('button', {
            onClick: startPoc,
            className: "mt-4 inline-flex items-center gap-1.5 rounded-md px-3 py-2 text-xs font-medium text-slate-950",
            style: { background: "#2dd4bf" }
          }, "➕ Start a PoC")
        );
      }

      const counts = poc.criteria.reduce((a, c) => { a[c.status] = (a[c.status] || 0) + 1; return a; }, {});
      const total = poc.criteria.length || 1;
      const passPct = Math.round(((counts.pass || 0) / total) * 100);

      return React.createElement('div', null,
        React.createElement('div', { className: "rounded-lg border border-slate-800 bg-slate-900 p-4" },
          React.createElement('div', { className: "flex items-center justify-between flex-wrap gap-3" },
            React.createElement('div', { className: "flex items-center gap-3" },
              React.createElement(HealthDot, { health: derivePocHealth(opp) }),
              React.createElement('span', { className: "text-xs text-slate-500" }, `${passPct}% criteria passing`)
            ),
            React.createElement('button', { onClick: stopPoc, className: "text-xs text-slate-500 hover:text-slate-300" }, "End PoC")
          ),
          React.createElement('div', { className: "mt-3 h-2 rounded-full bg-slate-800 overflow-hidden" },
            React.createElement('div', { className: "h-full rounded-full", style: { width: `${passPct}%`, background: "#34d399" } })
          ),
          React.createElement('div', { className: "grid grid-cols-2 gap-3 mt-3" },
            React.createElement(Field, { label: "Start date" },
              React.createElement(DateInput, { value: poc.startDate, onChange: (date) => setPoc((p) => ({ ...p, startDate: date })) })
            ),
            React.createElement(Field, { label: "Target / decision date" },
              React.createElement(DateInput, { value: poc.targetDate, onChange: (date) => setPoc((p) => ({ ...p, targetDate: date })) })
            )
          )
        ),
        React.createElement('div', { className: "mt-4 flex items-end gap-2" },
          React.createElement('div', { className: "flex-1" },
            React.createElement(Field, { label: "Add success criterion" },
              React.createElement('input', {
                className: inputCls,
                value: label,
                onChange: (e) => setLabel(e.target.value),
                onKeyDown: (e) => e.key === "Enter" && addCriterion(),
                placeholder: "e.g. EDM fingerprint match"
              })
            )
          ),
          React.createElement('select', { className: inputCls + " w-28", value: owner, onChange: (e) => setOwner(e.target.value) },
            React.createElement('option', null, "SE"),
            React.createElement('option', null, "Customer"),
            React.createElement('option', null, "Joint")
          ),
          React.createElement('button', { onClick: addCriterion, className: "rounded-md px-3 py-2 text-xs font-medium text-slate-950", style: { background: "#2dd4bf" } }, "Add")
        ),
        React.createElement('div', { className: "mt-4 space-y-2" },
          poc.criteria.length === 0 && React.createElement(Empty, { msg: "Define your exit criteria above." }),
          poc.criteria.map((c) =>
            React.createElement('div', { key: c.id, className: "rounded-lg border border-slate-800 bg-slate-900 p-3" },
              React.createElement('div', { className: "flex items-start justify-between gap-3" },
                React.createElement('div', { className: "flex-1" },
                  React.createElement('div', { className: "text-sm text-slate-200" }, c.label),
                  React.createElement('div', { className: "mt-0.5 text-[11px] text-slate-500" }, `Owner: ${c.owner}`)
                ),
                React.createElement('button', { onClick: () => delCriterion(c.id), className: "text-slate-600 hover:text-rose-400 mt-0.5" }, "🗑")
              ),
              React.createElement('div', { className: "mt-2 flex items-center gap-1.5" },
                Object.entries(POC_STATUS).map(([key, s]) => {
                  const on = c.status === key;
                  return React.createElement('button', {
                    key,
                    onClick: () => setStatus(c.id, key),
                    className: "inline-flex items-center gap-1 rounded px-2 py-1 text-[11px] border",
                    style: {
                      borderColor: on ? s.color : "#334155",
                      background: on ? s.color + "1a" : "transparent",
                      color: on ? s.color : "#64748b",
                    }
                  }, s.label);
                })
              ),
              React.createElement('input', {
                className: "mt-2 w-full rounded border border-slate-800 bg-slate-950 px-2 py-1.5 text-xs text-slate-300 placeholder-slate-600 focus:border-teal-600 focus:outline-none",
                value: c.note || "",
                onChange: (e) => setNote(c.id, e.target.value),
                placeholder: "Evidence / blocker / note…"
              })
            )
          )
        )
      );
    }

    // ---- Main App ---------------------------------------------------------------
    function SETracker() {
      const [opps, setOpps] = useState([]);
      const [loaded, setLoaded] = useState(false);
      const [selectedId, setSelectedId] = useState(null);
      const [tab, setTab] = useState("overview");
      const [adding, setAdding] = useState(false);
      const [filter, setFilter] = useState("all");

      useEffect(() => {
        loadOpps().then((data) => {
          setOpps(data);
          setLoaded(true);
        });
      }, []);

      useEffect(() => {
        if (loaded) persist(opps);
      }, [opps, loaded]);

      const selected = opps.find((o) => o.id === selectedId) || null;

      const update = (id, fn) =>
        setOpps((prev) => prev.map((o) => (o.id === id ? fn({ ...o }) : o)));

      const removeOpp = (id) => {
        setOpps((prev) => prev.filter((o) => o.id !== id));
        if (selectedId === id) setSelectedId(null);
      };

      const stats = useMemo(() => {
        const livePocs = opps.filter((o) => o.poc?.active);
        const atRisk = livePocs.filter((o) => ["amber", "red"].includes(derivePocHealth(o)));
        const totalAcv = opps.reduce((sum, o) => sum + (o.acv || 0), 0);
        return {
          active: opps.filter((o) => o.seStage !== "Handoff / closed").length,
          poc: livePocs.length,
          risk: atRisk.length,
          acv: totalAcv,
        };
      }, [opps]);

      const filtered = useMemo(() => {
        if (filter === "all") return opps;
        if (filter === "poc") return opps.filter((o) => o.poc?.active);
        if (filter === "risk") return opps.filter((o) => ["amber", "red"].includes(derivePocHealth(o)));
        return opps;
      }, [opps, filter]);

      const exportData = () => {
        const blob = new Blob([JSON.stringify(opps, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `se-tracker-${today()}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      if (!loaded) {
        return React.createElement('div', { className: "min-h-screen bg-slate-950 flex items-center justify-center text-slate-500" },
          React.createElement('div', { className: "flex items-center gap-2 text-sm" },
            React.createElement('span', { className: "animate-spin" }, "⏳"),
            "Loading your tracker…"
          )
        );
      }

      function AddModal({ onClose, onCreate }) {
        const [account, setAccount] = useState("");
        const [segment, setSegment] = useState("");
        const [seStage, setSeStage] = useState(SE_STAGES[0]);
        const [acv, setAcv] = useState("");

        const create = () => {
          if (!account.trim()) return;
          onCreate({
            id: uid(),
            account: account.trim(),
            segment: segment.trim(),
            seStage,
            acv: parseInt(acv) || 0,
            nextMeetDate: "",
            products: [],
            champion: "",
            competitor: "",
            nextAction: "",
            createdAt: today(),
            notes: [],
            demos: [],
            poc: { active: false, criteria: [] },
          });
        };

        return React.createElement('div', { className: "fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4", onClick: onClose },
          React.createElement('div', { className: "w-full max-w-md rounded-xl border border-slate-700 bg-slate-900 p-5", onClick: (e) => e.stopPropagation() },
            React.createElement('div', { className: "flex items-center justify-between mb-4" },
              React.createElement('h3', { className: "text-slate-100 font-medium" }, "New opportunity"),
              React.createElement('button', { onClick: onClose, className: "text-slate-500 hover:text-slate-300" }, "✕")
            ),
            React.createElement('div', { className: "space-y-3" },
              React.createElement(Field, { label: "Account name" },
                React.createElement('input', {
                  autoFocus: true,
                  className: inputCls,
                  value: account,
                  onChange: (e) => setAccount(e.target.value),
                  onKeyDown: (e) => e.key === "Enter" && create(),
                  placeholder: "Acme Corp"
                })
              ),
              React.createElement(Field, { label: "Segment" },
                React.createElement('input', {
                  className: inputCls,
                  value: segment,
                  onChange: (e) => setSegment(e.target.value),
                  placeholder: "Enterprise · Healthcare"
                })
              ),
              React.createElement(Field, { label: "ACV" },
                React.createElement('input', {
                  className: inputCls,
                  type: "number",
                  value: acv,
                  onChange: (e) => setAcv(e.target.value),
                  placeholder: "0"
                })
              ),
              React.createElement(Field, { label: "Starting SE stage" },
                React.createElement('select', { className: inputCls, value: seStage, onChange: (e) => setSeStage(e.target.value) },
                  SE_STAGES.map((s) => React.createElement('option', { key: s }, s))
                )
              )
            ),
            React.createElement('div', { className: "mt-5 flex justify-end gap-2" },
              React.createElement('button', { onClick: onClose, className: "rounded-md border border-slate-700 px-3 py-2 text-xs text-slate-400" }, "Cancel"),
              React.createElement('button', { onClick: create, className: "rounded-md px-3 py-2 text-xs font-medium text-slate-950", style: { background: "#2dd4bf" } }, "Create")
            )
          )
        );
      }

      return React.createElement('div', { className: "min-h-screen bg-slate-950 text-slate-200" },
        React.createElement('div', { className: "max-w-6xl mx-auto px-4 py-6" },
          // Header
          React.createElement('div', { className: "flex items-center justify-between flex-wrap gap-3 border-b border-slate-800 pb-4" },
            React.createElement('div', null,
              React.createElement('div', { className: "flex items-center gap-2" },
                React.createElement('span', { style: { fontSize: "20px" } }, "🎯"),
                React.createElement('h1', { className: "text-lg font-semibold text-slate-100" }, "SE Tracker"),
                React.createElement('span', { className: "font-mono text-[11px] text-slate-600" }, "technical pursuit log")
              ),
              React.createElement('p', { className: "text-xs text-slate-500 mt-1" }, "Notes, demos and PoC validation")
            ),
            React.createElement('div', { className: "flex items-center gap-2" },
              React.createElement('button', {
                onClick: exportData,
                className: "inline-flex items-center gap-1.5 rounded-md border border-slate-700 bg-slate-900 px-3 py-2 text-xs text-slate-300 hover:border-slate-600"
              }, "📥 Export"),
              React.createElement('button', {
                onClick: () => setAdding(true),
                className: "inline-flex items-center gap-1.5 rounded-md px-3 py-2 text-xs font-medium text-slate-950",
                style: { background: "#2dd4bf" }
              }, "➕ New opportunity")
            )
          ),

          // Stats
          React.createElement('div', { className: "grid grid-cols-2 md:grid-cols-4 gap-3 mt-5" },
            React.createElement(StatTile, { icon: "💼", label: "Active opps", value: stats.active, accent: "#2dd4bf" }),
            React.createElement(StatTile, { icon: "🧪", label: "Live PoCs", value: stats.poc, accent: "#38bdf8" }),
            React.createElement(StatTile, { icon: "⚠️", label: "PoCs at risk", value: stats.risk, sub: stats.risk ? "needs your attention" : "all clear", accent: "#fbbf24" }),
            React.createElement(StatTile, { icon: "💰", label: "Total ACV", value: stats.acv >= 1000000 ? "$" + (stats.acv / 1000000).toFixed(1) + "m" : "$" + (stats.acv / 1000).toFixed(0) + "k", accent: "#34d399" })
          ),

          // Body
          selected ?
            React.createElement('div', { className: "mt-5" },
              React.createElement('button', {
                onClick: () => setSelectedId(null),
                className: "inline-flex items-center gap-1 text-sm text-slate-400 hover:text-slate-200"
              }, "← All opportunities"),
              React.createElement('div', { className: "mt-3 flex items-center justify-between" },
                React.createElement('div', { className: "flex items-center gap-3" },
                  React.createElement('h2', { className: "text-xl font-semibold text-slate-100" }, selected.account),
                  React.createElement(HealthDot, { health: derivePocHealth(selected) })
                ),
                React.createElement('button', {
                  onClick: () => {
                    if (confirm(`Delete "${selected.account}"?`)) removeOpp(selected.id);
                  },
                  className: "px-3 py-1 text-sm rounded bg-red-900/30 text-red-400 hover:bg-red-900/50 border border-red-900/50"
                }, "Delete")
              ),
              React.createElement('div', { className: "mt-4 flex items-center gap-1 border-b border-slate-800" },
                ["overview", "notes", "demos", "poc"].map((t) =>
                  React.createElement('button', {
                    key: t,
                    onClick: () => setTab(t),
                    className: `inline-flex items-center gap-1.5 px-3 py-2 text-sm border-b-2 -mb-px ${
                      tab === t ? "border-teal-500 text-teal-300" : "border-transparent text-slate-400 hover:text-slate-200"
                    }`
                  }, t.charAt(0).toUpperCase() + t.slice(1))
                )
              ),
              React.createElement('div', { className: "mt-5" },
                tab === "overview" && React.createElement(OverviewTab, { opp: selected, update }),
                tab === "notes" && React.createElement(NotesTab, { opp: selected, update }),
                tab === "demos" && React.createElement(DemosTab, { opp: selected, update }),
                tab === "poc" && React.createElement(PocTab, { opp: selected, update })
              )
            )
          :
            React.createElement('div', { className: "mt-5" },
              React.createElement('div', { className: "flex items-center gap-1.5 mb-3" },
                ["all", "poc", "risk"].map((f) =>
                  React.createElement('button', {
                    key: f,
                    onClick: () => setFilter(f),
                    className: `rounded-md px-2.5 py-1 text-xs border ${
                      filter === f
                        ? "border-teal-500 bg-teal-500/10 text-teal-300"
                        : "border-slate-800 bg-slate-900 text-slate-400 hover:border-slate-700"
                    }`
                  }, f === "all" ? "All" : f === "poc" ? "Live PoCs" : "At risk")
                )
              ),
              opps.length === 0 ?
                React.createElement('div', { className: "mt-10 rounded-xl border border-dashed border-slate-800 bg-slate-900/50 p-10 text-center" },
                  React.createElement('span', { style: { fontSize: "28px" } }, "🎯"),
                  React.createElement('h2', { className: "mt-3 text-slate-200 font-medium" }, "No opportunities yet"),
                  React.createElement('button', {
                    onClick: () => setAdding(true),
                    className: "mt-5 inline-flex items-center gap-1.5 rounded-md px-3 py-2 text-xs font-medium text-slate-950",
                    style: { background: "#2dd4bf" }
                  }, "➕ Add your first opportunity"),
                  React.createElement('button', {
                    onClick: () => setOpps([sampleOpp()]),
                    className: "ml-2 rounded-md border border-slate-700 bg-slate-900 px-3 py-2 text-xs text-slate-300 hover:border-slate-600"
                  }, "Load sample")
                )
              :
                React.createElement('div', { className: "overflow-x-auto rounded-lg border border-slate-800" },
                  React.createElement('table', { className: "w-full text-sm" },
                    React.createElement('thead', null,
                      React.createElement('tr', { className: "bg-slate-900 text-left text-[11px] uppercase tracking-wider text-slate-500" },
                        React.createElement('th', { className: "px-3 py-2 font-medium" }, "Account"),
                        React.createElement('th', { className: "px-3 py-2 font-medium" }, "SE stage"),
                        React.createElement('th', { className: "px-3 py-2 font-medium" }, "PoC health"),
                        React.createElement('th', { className: "px-3 py-2 font-medium" }, "Products"),
                        React.createElement('th', { className: "px-3 py-2 font-medium" }, "Next action")
                      )
                    ),
                    React.createElement('tbody', null,
                      filtered.map((o) =>
                        React.createElement('tr', {
                          key: o.id,
                          onClick: () => { setSelectedId(o.id); setTab("overview"); },
                          className: "border-t border-slate-800 cursor-pointer hover:bg-slate-900/60"
                        },
                          React.createElement('td', { className: "px-3 py-3" },
                            React.createElement('div', { className: "font-medium text-slate-100" }, o.account),
                            React.createElement('div', { className: "text-xs text-slate-500" }, o.segment)
                          ),
                          React.createElement('td', { className: "px-3 py-3" },
                            React.createElement('span', { className: "text-xs text-slate-300" }, o.seStage)
                          ),
                          React.createElement('td', { className: "px-3 py-3" },
                            React.createElement(HealthDot, { health: derivePocHealth(o) })
                          ),
                          React.createElement('td', { className: "px-3 py-3" },
                            React.createElement('div', { className: "flex flex-wrap gap-1" },
                              (o.products || []).map((p) => React.createElement(Pill, { key: p }, p))
                            )
                          ),
                          React.createElement('td', { className: "px-3 py-3 text-xs text-slate-400 max-w-xs" }, o.nextAction || "—")
                        )
                      )
                    )
                  )
                )
            )
        ),
        adding && React.createElement(AddModal, {
          onClose: () => setAdding(false),
          onCreate: (opp) => {
            setOpps((prev) => [opp, ...prev]);
            setAdding(false);
            setSelectedId(opp.id);
            setTab("overview");
          }
        })
      );
    }

    // Mount the app
    createRoot(document.getElementById('root')).render(React.createElement(SETracker));
  </script>
</body>
</html>
