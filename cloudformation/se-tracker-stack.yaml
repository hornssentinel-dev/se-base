AWSTemplateFormatVersion: '2010-09-09'
Description: >
  SE Tracker - single EC2 instance running the Express app behind Caddy
  (automatic Let's Encrypt HTTPS) for a domain hosted outside Route53.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to launch the instance in (e.g. your default VPC)

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet (must auto-assign public IPs, or the EIP association will fail)

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair for SSH/rsync access

  SSHLocationCidr:
    Type: String
    Description: CIDR block allowed to SSH in, e.g. 203.0.113.5/32
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: Must be a valid CIDR block, e.g. 203.0.113.5/32

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t3.medium]

  DomainName:
    Type: String
    Default: sebase.phalens.com
    Description: Public DNS name that will point at this instance (A record managed at your external DNS provider)

  RootVolumeSize:
    Type: Number
    Default: 20
    Description: Root EBS volume size in GB (holds the app and data/storage.json)

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SE Tracker instance - SSH restricted, HTTP/HTTPS open
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHLocationCidr
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: se-tracker-sg

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      IamInstanceProfile: !Ref InstanceProfile
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref RootVolumeSize
            DeleteOnTermination: false
      Tags:
        - Key: Name
          Value: se-tracker
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail

          # Node.js 20.x
          curl -fsSL https://rpm.nodesource.com/setup_20.x | bash -
          dnf install -y nodejs rsync

          # App directory (code is pushed later via scripts/deploy.sh)
          mkdir -p /opt/se-tracker
          chown ec2-user:ec2-user /opt/se-tracker

          # Caddy - official static binary, gives free auto-renewing HTTPS
          curl -fsSL -o /usr/bin/caddy "https://caddyserver.com/api/download?os=linux&arch=amd64"
          chmod +x /usr/bin/caddy

          mkdir -p /etc/caddy
          cat > /etc/caddy/Caddyfile <<'CADDYFILE'
          ${DomainName} {
              reverse_proxy localhost:3000
          }
          CADDYFILE

          cat > /etc/systemd/system/caddy.service <<'CADDYSERVICE'
          [Unit]
          Description=Caddy
          After=network.target

          [Service]
          Type=simple
          User=root
          ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile
          ExecReload=/usr/bin/caddy reload --config /etc/caddy/Caddyfile
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          CADDYSERVICE

          cat > /etc/systemd/system/se-tracker.service <<'SERVICEEOF'
          [Unit]
          Description=SE Tracker Application
          After=network.target

          [Service]
          Type=simple
          User=ec2-user
          WorkingDirectory=/opt/se-tracker
          ExecStart=/usr/bin/node /opt/se-tracker/server.js
          Restart=on-failure
          RestartSec=10
          StandardOutput=journal
          StandardError=journal

          Environment="NODE_ENV=production"
          Environment="PORT=3000"

          [Install]
          WantedBy=multi-user.target
          SERVICEEOF

          systemctl daemon-reload
          systemctl enable --now caddy
          systemctl enable se-tracker

  ElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref EC2Instance
      Tags:
        - Key: Name
          Value: se-tracker-eip

Outputs:
  ElasticIP:
    Description: Public IP - point your DNS A record here
    Value: !Ref ElasticIP

  SSHCommand:
    Description: SSH command for administration
    Value: !Sub ssh ec2-user@${ElasticIP}

  URL:
    Description: App URL once DNS is pointed here and Caddy has obtained a cert
    Value: !Sub https://${DomainName}

  DNSInstruction:
    Description: Manual step required outside AWS
    Value: !Sub 'At your DNS provider for phalens.com, add an A record: ${DomainName} -> ${ElasticIP}'
